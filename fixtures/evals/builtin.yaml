- id: excel_001
  name: 客户清单异常分析
  category: data-analysis
  tags: [excel, anomaly]
  input: { message: "分析客户清单，识别异常并给出营销建议。", files: [{ path: input/customer_data.xlsx, required: true }] }
  config: { model: deterministic-local, provider: deterministic, skill: excel-data-analysis }
  expected: { mustCallTools: [xlsx.inspect, python.run], mustGenerate: [{ type: markdown, nameContains: analysis_report }], mustInclude: [数据概况, 营销建议], mustNotInclude: [无法分析], constraints: { noUnauthorizedCalls: true } }
  scoring: { maxScore: 5, dimensions: [{ name: 工具调用正确性, weight: 1 }] }
  releaseGate: { minScore: 4, mustPass: true }
