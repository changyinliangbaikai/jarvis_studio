name: docx.read
version: "0.5.0"
category: office
description: Read a text, Markdown, or DOCX input file inside the workspace. DOCX extraction is metadata-only in the lite runtime.
risk_level: low
default_policy: allow
permission: filesystem.read

input_schema:
  type: object
  properties:
    path: { type: string }
  required: [path]
  additionalProperties: false

output_schema:
  type: object
  properties:
    path: { type: string }
    text: { type: string }
    sizeBytes: { type: number }
    warning: { type: string }

permissions:
  filesystem:
    read: [workspace]
  network: false
  shell: false

runtime:
  sandbox: true
  timeout_ms: 5000

context_injection:
  mode: summary
  max_tokens: 1200

---

name: docx.write
version: "0.5.0"
category: office
description: Write a lightweight document artifact inside the workspace.
risk_level: medium
default_policy: allow
permission: filesystem.write

input_schema:
  type: object
  properties:
    path: { type: string }
    content: { type: string }
  required: [path, content]
  additionalProperties: false

output_schema:
  type: object
  properties:
    path: { type: string }
    sizeBytes: { type: number }
    sha256: { type: string }
    warning: { type: string }

permissions:
  filesystem:
    write: [workspace/output]
  network: false
  shell: false

runtime:
  sandbox: true
  timeout_ms: 10000

context_injection:
  mode: summary
  max_tokens: 800
