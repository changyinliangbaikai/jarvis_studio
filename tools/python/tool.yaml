name: python.run
version: "0.4.0"
category: execution
description: Run a Python script located inside the configured workspace using the fixed python3 executable.
risk_level: medium
default_policy: allow
permission: process.python

input_schema:
  type: object
  properties:
    scriptPath:
      type: string
      description: Path to a .py file inside workspace.
    args:
      type: array
      items: { type: string }
  required: [scriptPath]
  additionalProperties: false

output_schema:
  type: object
  properties:
    exitCode: { type: number }
    stdout: { type: string }
    stderr: { type: string }
    latencyMs: { type: number }

permissions:
  filesystem:
    read: [workspace]
    write: [workspace/output]
  network: false
  shell: false

runtime:
  sandbox: true
  timeout_ms: 30000
  max_stdout_tokens: 3000
  max_stderr_tokens: 3000

context_injection:
  mode: summary
  max_tokens: 1500
