name: xlsx.inspect
version: "0.4.0"
category: office
description: Inspect workbook sheets, headers, samples, missing values, and numeric summaries.
risk_level: low
default_policy: allow
permission: filesystem.read

input_schema:
  type: object
  properties:
    path:
      type: string
      description: Relative path to the .xlsx file inside workspace.
    sampleRows:
      type: number
      description: Number of sample rows to include (1-50, default 10).
  required: [path]
  additionalProperties: false

output_schema:
  type: object
  properties:
    path: { type: string }
    sheetNames: { type: array, items: { type: string } }
    sheets:
      type: array
      items:
        type: object
        properties:
          name: { type: string }
          rows: { type: number }
          columns: { type: number }
          headers: { type: array }
          missingValues: { type: object }
          numericSummary: { type: object }
          sample: { type: array }

permissions:
  filesystem:
    read: [workspace]
  network: false
  shell: false

runtime:
  sandbox: true
  timeout_ms: 15000

context_injection:
  mode: summary
  max_tokens: 1800
